<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>  
    <main class="container">
      <div class="box">
        <!-- Left-box  -->
        <section class="left-box">
          <h2 class="section-title">Your Result</h2>
          <div class="mid-box">
            <p class="bold">76</p>
            <p class="number"> of 100</p>
          </div>
          <p class="result">Great</p>
          <p class="text">You scored higher than 65% of the people who have taken these tests</p>
        </section>
        <!-- Left-box  -->
         <!-- Right-box  -->
        <section class="right-box">
          <h2 class="section-title">Summary</h2>
          <div class="stats">
            <div class="stat">
            <div class="title-group">
              <img src="assets/images/icon-reaction.svg" alt="Reaction Icon" aria-hidden="true">
              <p class="title">Reaction</p>
            </div>
            <p class="degree"><span>80</span>/ 100</p>
            </div>
            <div class="stat">
              <div class="title-group">
                <img src="assets/images/icon-memory.svg" alt="Memory Icon" aria-hidden="true">
                <p class="title">Memory</p>
              </div>
              <p class="degree"><span>92</span>/ 100</p>
            </div>
            <div class="stat">
              <div class="title-group">
                <img src="assets/images/icon-verbal.svg" alt="Verbal Icon" aria-hidden="true">
                <p class="title">Verbal</p>
              </div>
              <p class="degree"><span>61</span>/ 100</p>
            </div>
            <div class="stat">
              <div class="title-group">
                <img src="assets/images/icon-visual.svg" alt="Visual Icon" aria-hidden="true">
                <p class="title">Visual</p>
              </div>
              <p class="degree"><span>73</span>/ 100</p>
            </div>
          </div>
          <button type="button">Continue</button>
        </section>
        <!-- Right-box  -->
      </div>
    </main>
</body>
</html>
